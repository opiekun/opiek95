<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doom</title>
  <link rel="stylesheet" href="doom.css">
  <script src="doom.js" defer></script>
</head>
<body>
  <main class="game">
    <div class="screen">
      <canvas id="canvas" tabindex="0" aria-label="Doom game screen"></canvas>
      <div class="launcher" id="launcher">
        <div class="launcher-panel">
          <div class="launcher-heading"><img src="../icons/executable-0.png" alt=""><span>Game setup</span></div>
          <div class="launcher-body">
            <h1>DOOM</h1>
            <p class="launcher-edition" id="edition">The original 1993 game · Shareware Episode 1</p>
            <div class="launcher-rule"></div>
            <label for="game-data">Choose game:</label>
            <select id="game-data">
              <option value="doom1.wad">Doom (1993) — Shareware Episode 1</option>
              <option value="freedoom1.wad">Freedoom — Phase 1</option>
            </select>
            <p class="launcher-note">Game files load when you press Load game. Your progress stays in this browser.</p>
            <div class="launcher-actions"><button id="play" type="button">Load game</button></div>
            <p id="status" role="status" aria-live="polite">Ready to load.</p>
          </div>
        </div>
      </div>
    </div>
    <div class="help">Arrows: move · Ctrl: fire · Space: use · Shift: run · Esc: menu</div>
    <div class="touch-controls" aria-label="Touch game controls">
      <div><button data-key="ArrowLeft" type="button">◀</button><button data-key="ArrowUp" type="button">▲</button><button data-key="ArrowRight" type="button">▶</button><button data-key="Control" type="button">FIRE</button></div>
      <div><button data-key="Shift" type="button">RUN</button><button data-key="ArrowDown" type="button">▼</button><button data-key="Space" type="button">USE</button><button data-key="Enter" type="button">ENTER</button><button data-key="Escape" type="button">ESC</button></div>
    </div>
  </main>
</body>
</html>
